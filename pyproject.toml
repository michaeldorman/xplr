[build-system]
requires = [
    "hatchling >= 1.26",
    "pandas >= 3.0.0",
]
build-backend = "hatchling.build"

[project]
name = "bgu"
version = "0.0.1"
authors = [
  { name="Michael Dorman", email="dorman@post.bgu.ac.il" },
]
description = "Utility functions for work at BGU"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/michaeldorman/bgu/"
Issues = "https://github.com/michaeldorman/bgu/issues"
